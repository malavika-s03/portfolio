<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA redirect: preserve the path as a query param so index.html can restore it
      var path = location.pathname + location.search + location.hash;
      location.replace('/?p=' + encodeURIComponent(path));
    </script>
  </head>
</html>
